<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Stack — Replay</title>
  <link rel="stylesheet" href="static/style.css" />
</head>
<body>
  <main>
    <section id="board-panel"></section>

    <section id="side-panel">
      <section id="control-panel">
        <header id="topbar">
          <div id="title">The Stack</div>
          <select id="game-picker" aria-label="game"></select>
          <span id="game-summary"></span>
        </header>

        <section id="scrubber-row">
          <button id="prev" title="previous observation">◄</button>
          <input id="scrubber" type="range" min="0" max="0" value="0" step="1" />
          <button id="next" title="next observation">►</button>
          <span id="step-label">0 / 0</span>
          <span id="state-label"></span>
          <label id="show-all-toggle" title="include observations after autopassed priorities">
            <input id="show-all" type="checkbox" />
            show every step
          </label>
        </section>
      </section>
      <nav id="tabs"></nav>
      <div id="tab-body"></div>
    </section>
  </main>

  <div id="deck-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="deck-modal-title">
    <div class="modal-backdrop" data-close-modal="deck"></div>
    <section class="deck-modal-card">
      <header class="deck-modal-head">
        <div>
          <h2 id="deck-modal-title">library and deck</h2>
          <div id="deck-modal-meta"></div>
        </div>
        <button id="deck-modal-close" type="button" aria-label="close deck modal">×</button>
      </header>
      <div id="deck-modal-body"></div>
    </section>
  </div>

  <script src="static/board.js"></script>
  <script src="static/gamedata.js"></script>
  <script src="static/app.js"></script>
</body>
</html>
