[project]
name = "thestack"
version = "0.1.0"
description = "LLM-driven Magic: The Gathering harness"
requires-python = ">=3.12"
dependencies = [
    "ollama>=0.6.2",
    "openai>=1.0",
    "requests>=2.32",
]

[project.scripts]
run-game = "run_game:main"

[dependency-groups]
dev = [
    "ruff>=0.11",
    "ty>=0.0.1a9",
    "pre-commit>=4.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.ty]
python-version = "3.12"
