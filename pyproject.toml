[project]
name = "thestack"
version = "0.1.0"
description = "LLM-driven Magic: The Gathering harness"
requires-python = ">=3.12"
dependencies = [
    "ollama>=0.6.2",
    "requests>=2.32",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.scripts]
run-game = "run_game:main"
viewer = "viewer.server:main"

[project.optional-dependencies]
telemetry = [
    "mlflow>=2.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Flat-layout package: list the top-level dirs explicitly so hatchling
# doesn't try to auto-discover. run_game is a single-file module; the
# viewer's static/ assets are not .py so they need force-include.
[tool.hatch.build.targets.wheel]
packages = ["llm", "game", "cards", "viewer"]
include = ["run_game.py"]

[tool.hatch.build.targets.wheel.force-include]
"viewer/static" = "viewer/static"

[dependency-groups]
dev = [
    "ruff>=0.11",
    "ty>=0.0.1a9",
    "pre-commit>=4.0",
]
# Optional Claude Agent SDK backend — subscription-billed driver for the
# Phase B "frontier model" experiments. Pulled in via `uv sync --group frontier`;
# the Ollama path keeps working without it.
frontier = [
    "claude-agent-sdk>=0.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.ty]
python-version = "3.12"
